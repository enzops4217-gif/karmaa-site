<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e2bf"/>
      <stop offset=".45" stop-color="#d4b483"/>
      <stop offset="1" stop-color="#9a7748"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1c1a"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd6ab" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#d4b483" stop-opacity=".25"/>
      <stop offset="1" stop-color="#a8885a" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="236" height="236" rx="58" fill="url(#bg)"/>
  <rect x="10" y="10" width="236" height="236" rx="58" fill="url(#sheen)"/>
  <rect x="11" y="11" width="234" height="234" rx="57" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <!-- Monogramme K : un fût et deux bras séparés par une fine coupe -->
  <g fill="url(#gold)">
    <rect x="76" y="62" width="28" height="132" rx="3"/>
    <polygon points="116,121 160,62 194,62 146,121"/>
    <polygon points="116,135 146,135 194,194 160,194"/>
